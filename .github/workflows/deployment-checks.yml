name: Deployment checks

on:
  push:
    branches: [master, dev, "feat/**", deploy/vercel-render]
  pull_request:
    paths:
      - '.github/workflows/deployment-checks.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'workflow/**'
      - 'agent/**'
      - 'vercel.ts'
      - 'render.yaml'
      - 'package.json'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Render image
        run: docker build -t considea-ci .
      - name: Verify workflow inside the deployment image
        run: docker run --rm considea-ci python -m unittest discover -s workflow/tests -v
      - name: Verify cloud entry point and HTTP persistence
        run: docker run --rm considea-ci python -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Verify agent contracts
        run: docker run --rm considea-ci python agent/interfaces/validate_contracts.py
      - name: Verify all teammate agents and SpacetimeDB reducers
        run: |
          docker run --rm considea-ci python -m unittest agent.negotiate.test_negotiator -v
          docker run --rm --workdir /app/agent/negotiate considea-ci node --test '*.test.mjs'
          docker run --rm considea-ci python -m unittest discover -s agent/evaluator/test -p '*_test.py' -v
          docker run --rm --workdir /app/agent/interview considea-ci node --test '*.test.mjs' 'agentverse/*.test.mjs' '../pi-base/*.test.mjs'
          docker run --rm --workdir /app/agent/idea considea-ci node --test '*.test.mjs'
          docker run --rm --workdir /app/agent/evaluator considea-ci node --test 'test/*.test.mjs'
          docker run --rm --workdir /app/agent/idea/spacetime considea-ci node node_modules/typescript/bin/tsc --noEmit
          docker run --rm --workdir /app/agent/idea/spacetime considea-ci node --test module.test.mjs
          docker run --rm --workdir /app/workflow/node considea-ci node --test localize.test.mjs
          docker run --rm --workdir /app/workflow/node considea-ci node --input-type=module -e "await import('./spacetime.mjs')"
      - name: Verify frontend routing and build
        run: |
          docker run --rm considea-ci node --test 'deploy/tests/*.test.mjs'
          docker run --rm considea-ci node deploy/build-frontend.mjs

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -r workflow/requirements.txt
          npm install --prefix "$RUNNER_TEMP/interface-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/interface-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise the interface through HTTP and SQLite
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/interface-browser/node_modules/playwright
        run: |
          node workflow/node/interface-smoke.mjs
          node workflow/node/interview-rounds-smoke.mjs
          node workflow/node/privacy-smoke.mjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: considea_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r workflow/requirements.txt
      - name: Test PostgreSQL transactions, concurrent workers and restart recovery
        env:
          CONCLAVE_TEST_POSTGRES_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/considea_test
        run: python -m unittest workflow.tests.test_postgres -v
